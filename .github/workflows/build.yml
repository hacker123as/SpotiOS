name: Build SpotiOS APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Use preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # Signing key: a repo secret if you add one (SPOTIOS_KEYSTORE_B64 etc.),
      # otherwise a key generated once and kept in the Actions cache so
      # every build installs over the previous one.
      - name: Restore cached signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/spotios-signing
          key: spotios-signing-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SPOTIOS_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SPOTIOS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPOTIOS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPOTIOS_KEY_PASSWORD }}
        run: |
          mkdir -p ~/spotios-signing
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/spotios-signing/release.jks
            echo "$STORE_PASSWORD" > ~/spotios-signing/store.pass
            echo "$KEY_ALIAS" > ~/spotios-signing/alias
            echo "$KEY_PASSWORD" > ~/spotios-signing/key.pass
          elif [ ! -f ~/spotios-signing/release.jks ]; then
            echo "::warning title=NEW signing key generated::The cached signing key (Actions cache spotios-signing-v1) was not found, so this build is signed with a brand-new key. It will NOT install over earlier SpotiOS builds: everyone has to uninstall first. Restore the old key or add the SPOTIOS_KEYSTORE_B64 secrets if you can."
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore ~/spotios-signing/release.jks \
              -alias spotios -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=SpotiOS, O=SpotiOS"
            echo "$PASS" > ~/spotios-signing/store.pass
            echo spotios > ~/spotios-signing/alias
            echo "$PASS" > ~/spotios-signing/key.pass
          fi
          echo "SPOTIOS_KEYSTORE=$HOME/spotios-signing/release.jks" >> "$GITHUB_ENV"
          echo "SPOTIOS_STORE_PASSWORD=$(cat ~/spotios-signing/store.pass)" >> "$GITHUB_ENV"
          echo "SPOTIOS_KEY_ALIAS=$(cat ~/spotios-signing/alias)" >> "$GITHUB_ENV"
          echo "SPOTIOS_KEY_PASSWORD=$(cat ~/spotios-signing/key.pass)" >> "$GITHUB_ENV"

      # GITHUB_RUN_NUMBER (set by Actions) becomes BuildConfig.CI_BUILD, the "buildN" of the
      # release tag, so the app can tell builds of the same version apart when it checks for updates.
      - name: Build release APK
        run: |
          echo "CI build number: $GITHUB_RUN_NUMBER"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          OUT="SpotiOS-v${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CONFIG=app/build/generated/source/buildConfig/release/com/project/lol/BuildConfig.java
          if ! grep -q "CI_BUILD = ${GITHUB_RUN_NUMBER};" "$CONFIG" 2>/dev/null; then
            echo "::warning title=CI_BUILD mismatch::BuildConfig.CI_BUILD is not ${GITHUB_RUN_NUMBER}, so the in-app update check may miss builds of the same version."
          fi

      # The certificate fingerprint (public, not the key) goes in the release notes so a key change shows.
      - name: Signing certificate
        id: cert
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          SHA=$("${BUILD_TOOLS}apksigner" verify --print-certs "${{ steps.apk.outputs.file }}" \
            | grep -m1 'certificate SHA-256 digest:' | awk '{print $NF}')
          if [ -z "$SHA" ]; then
            echo "::error::Could not read the APK's signing certificate"
            exit 1
          fi
          echo "Signing certificate SHA-256: $SHA"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      # What's new is the pushed commit's message without trailer lines (Signed-off-by: and the like);
      # the app shows the part above "---".
      - name: Release notes
        run: |
          {
            git log -1 --format=%B | grep -vE '^[A-Za-z]+(-[A-Za-z]+)+: ' || true
            echo
            echo "---"
            echo
            echo "SpotiOS ${{ steps.apk.outputs.version }}, built from \`${{ github.sha }}\`."
            echo "Download the \`.apk\` below and install it (allow \"Install unknown apps\" if Android asks)."
            echo
            echo "Signing certificate SHA-256: \`${{ steps.cert.outputs.sha256 }}\`"
          } > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: SpotiOS-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-build${{ github.run_number }}
          name: SpotiOS ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: ${{ steps.apk.outputs.file }}
          body_path: release-notes.md
